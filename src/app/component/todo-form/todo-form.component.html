
<div class="card">
  <div class="card-body">

    <div class="form-group">
      <label for="title"><b>Title</b></label>
      <input type="text" id="title" #title class="form-control">
    </div>

    <div class="form-group">
      <label for="description"><b>Description</b></label>
      <input type="text" id="description" #description class="form-control">
    </div>
    <div class="form-group">
      <label for="description"><b>IsCompleted</b></label>
      <select type="text" id="isCompleted" #isCompleted class="form-control">
        <option value="true">Yes</option>
        <option value="false">No</option>
        </select>
    </div>
 <button
        *ngIf="!isInEditMode"
        (click)="ontodoadd()"
        mat-raised-button
        color="primary"
        class="w-100 mt-2" >
        ADD TODO
    </button>

    <button
        *ngIf="isInEditMode"
        (click)="onUpdateTodo()"
        mat-raised-button
        color="warn"
        class="w-100">
        UPDATE TODO
    </button>
  </div>
</div>
